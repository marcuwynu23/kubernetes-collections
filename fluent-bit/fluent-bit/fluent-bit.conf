[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_PORT    2020
[INPUT]
    Name         tail
    Path         /var/log/app/*.log
    Tag          app.*
    Read_from_Head true

[OUTPUT]
    Name         stdout
    Match        *
    Format       json_lines