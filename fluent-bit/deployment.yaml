apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fluent-bit-ns
  name: fluent-bit-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:latest
        ports:
        - name: fluent-bit-port
          containerPort: 2020
        volumeMounts:
        - name: fluent-bit-conf
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
          readOnly: true
        - name: fluent-bit-conf
          mountPath: /fluent-bit/etc/parsers.conf
          subPath: parsers.conf
          readOnly: true
        - name: fluent-bit-logs
          mountPath: /var/log/app
          readOnly: true
      volumes:
      - name: fluent-bit-conf
        configMap:
          name: fluent-bit-config
      - name: fluent-bit-logs
        persistentVolumeClaim:
          claimName: fluent-bit-logs-storage-claim
