apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deployment
  namespace: k8s-collections
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd
        image: httpd:trixie
        ports:
        - containerPort: 80