apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deployment
  namespace: k8s-collections
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd
        image: httpd:trixie
        ports:
        - containerPort: 80
        volumeMounts:
        - name: httpd-storage
          mountPath: /usr/local/apache2/htdocs/
        - name: html
          mountPath: /usr/local/apache2/htdocs/index.html
          subPath: index.html
      volumes:
      - name: httpd-storage
        persistentVolumeClaim:
          claimName: httpd-pvc
      - name: html
        configMap:
          name: httpd-html