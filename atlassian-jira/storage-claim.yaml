apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: atlassian-jira-ns
  name: jira-data-storage-claim
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: atlassian-jira-ns
  name: jira-db-storage-claim
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
