apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: haproxy-ns
  name: haproxy-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
      - name: haproxy
        image: haproxy:2.9-alpine
        ports:
        - name: http
          containerPort: 80
        - name: stats
          containerPort: 8404
        volumeMounts:
        - name: haproxy-config
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
          readOnly: true
      volumes:
      - name: haproxy-config
        configMap:
          name: haproxy-config
