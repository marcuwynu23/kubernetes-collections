global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    server app1 host.docker.internal:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s


