apiVersion: v1
kind: Service
metadata:
  namespace: pihole-ns
  name: pihole-service
spec:
  selector:
    app: pihole
  ports:
  - name: dns
    protocol: TCP
    port: 53
    targetPort: 53
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 80
  - name: https
    protocol: TCP
    port: 8443
    targetPort: 443
