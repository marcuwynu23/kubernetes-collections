---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpi
  namespace: devpi

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devpi

  template:
    metadata:
      labels:
        app: devpi

    spec:
      containers:
      - name: devpi
        image: muccg/devpi:latest

        command:
        - devpi

        ports:
        - name: http
          containerPort: 3141

        volumeMounts:
        - name: devpi-data
          mountPath: /data

      volumes:
      - name: devpi-data
        persistentVolumeClaim:
          claimName: devpi-data
