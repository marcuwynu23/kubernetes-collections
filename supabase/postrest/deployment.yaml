---
# ============================================================
# PostgREST Deployment
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  namespace: supabase
spec:
  replicas: 1

  selector:
    matchLabels:
      app: supabase-rest

  template:
    metadata:
      labels:
        app: supabase-rest

    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.3

        ports:
        - containerPort: 3000

        env:
        - name: PGRST_DB_URI
          value: "postgres://postgres:postgres@supabase-db:5432/postgres"

        - name: PGRST_DB_SCHEMAS
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: postgres-schemas

        - name: PGRST_DB_ANON_ROLE
          valueFrom:
            configMapKeyRef:
              name: supabase-config
              key: postgres-anon-role

        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: jwt-secret

        - name: PGRST_SERVER_PORT
          value: "3000"

        readinessProbe:
          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
