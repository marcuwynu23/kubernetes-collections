---
# ============================================================
# PostgreSQL Deployment
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-db
  namespace: supabase
spec:
  replicas: 1

  selector:
    matchLabels:
      app: supabase-db

  template:
    metadata:
      labels:
        app: supabase-db

    spec:
      containers:
      - name: postgres
        image: postgres:16

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: postgres-db

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: postgres-user

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: postgres-password

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10

        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: supabase-db-data
