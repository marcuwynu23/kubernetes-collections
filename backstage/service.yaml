apiVersion: v1
kind: Service
metadata:
  namespace: backstage-ns
  name: backstage-service
spec:
  type: ClusterIP
  selector:
    app: backstage
  ports:
  - name: http
    protocol: TCP
    port: 7007
    targetPort: 7007
---
apiVersion: v1
kind: Service
metadata:
  namespace: backstage-ns
  name: backstage-db-service
spec:
  type: ClusterIP
  selector:
    app: backstage-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
