apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: overleaf-ns
  name: overleaf-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overleaf
  template:
    metadata:
      labels:
        app: overleaf
    spec:
      containers:
      - name: overleaf
        image: overleaf/overleaf:latest
        ports:
        - name: http
          containerPort: 80
        env:
        - name: OVERLEAF_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: OVERLEAF_APP_NAME
        - name: OVERLEAF_MONGO_URL
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: OVERLEAF_MONGO_URL
        - name: OVERLEAF_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: OVERLEAF_REDIS_HOST
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: REDIS_HOST
        - name: ENABLED_LINKED_FILE_TYPES
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: ENABLED_LINKED_FILE_TYPES
        - name: ENABLE_CONVERSIONS
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: ENABLE_CONVERSIONS
        - name: EMAIL_CONFIRMATION_DISABLED
          valueFrom:
            configMapKeyRef:
              name: overleaf-config
              key: EMAIL_CONFIRMATION_DISABLED
        volumeMounts:
        - name: overleaf-data
          mountPath: /var/lib/overleaf
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      terminationGracePeriodSeconds: 60
      volumes:
      - name: overleaf-data
        persistentVolumeClaim:
          claimName: overleaf-data-storage-claim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: overleaf-ns
  name: overleaf-mongo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overleaf-mongo
  template:
    metadata:
      labels:
        app: overleaf-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:8.0
        args:
        - --replSet
        - overleaf
        ports:
        - name: mongo
          containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: overleaf-mongo-config
              key: MONGO_INITDB_DATABASE
        volumeMounts:
        - name: overleaf-mongo-storage
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: overleaf-mongo-storage
        persistentVolumeClaim:
          claimName: overleaf-mongo-storage-claim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: overleaf-ns
  name: overleaf-redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overleaf-redis
  template:
    metadata:
      labels:
        app: overleaf-redis
    spec:
      containers:
      - name: redis
        image: redis:6.2
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: overleaf-redis-storage
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: overleaf-redis-storage
        persistentVolumeClaim:
          claimName: overleaf-redis-storage-claim
