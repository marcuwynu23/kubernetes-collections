apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-server
  namespace: gitea

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gitea-server

  template:
    metadata:
      labels:
        app: gitea-server

    spec:
      containers:
      - name: gitea
        image: gitea/gitea:latest

        ports:
        - name: http
          containerPort: 3000

        - name: ssh
          containerPort: 22

        env:
        - name: USER_UID
          valueFrom:
            configMapKeyRef:
              name: gitea-config
              key: USER_UID

        - name: USER_GID
          valueFrom:
            configMapKeyRef:
              name: gitea-config
              key: USER_GID

        volumeMounts:
        - name: gitea-data
          mountPath: /data

      volumes:
      - name: gitea-data
        persistentVolumeClaim:
          claimName: gitea-data
