apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: portabase-ns
  name: portabase-data-storage-claim
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: portabase-ns
  name: portabase-db-storage-claim
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
