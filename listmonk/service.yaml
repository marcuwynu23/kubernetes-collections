apiVersion: v1
kind: Service
metadata:
  namespace: listmonk-ns
  name: listmonk-service
spec:
  type: ClusterIP
  selector:
    app: listmonk
  ports:
  - name: http
    protocol: TCP
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  namespace: listmonk-ns
  name: listmonk-db-service
spec:
  type: ClusterIP
  selector:
    app: listmonk-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
