apiVersion: v1
kind: Service
metadata:
  namespace: authentik-ns
  name: authentik-server-service
spec:
  type: ClusterIP
  selector:
    app: authentik-server
  ports:
  - name: http
    protocol: TCP
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  namespace: authentik-ns
  name: authentik-db-service
spec:
  type: ClusterIP
  selector:
    app: authentik-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  namespace: authentik-ns
  name: authentik-redis-service
spec:
  type: ClusterIP
  selector:
    app: authentik-redis
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
