---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vault

  template:
    metadata:
      labels:
        app: vault

    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest

        command:
        - vault

        args:
        - server
        - -dev

        ports:
        - name: http
          containerPort: 8200

        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: vault-secrets
              key: VAULT_DEV_ROOT_TOKEN_ID

        - name: VAULT_DEV_LISTEN_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: vault-config
              key: VAULT_DEV_LISTEN_ADDRESS

        securityContext:
          capabilities:
            add:
            - IPC_LOCK

        volumeMounts:
        - name: vault-data
          mountPath: /vault/file

      volumes:
      - name: vault-data
        persistentVolumeClaim:
          claimName: vault-data
