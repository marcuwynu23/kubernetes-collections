apiVersion: v1
kind: Service
metadata:
  namespace: mattermost-ns
  name: mattermost-service
spec:
  type: ClusterIP
  selector:
    app: mattermost
  ports:
  - name: http
    protocol: TCP
    port: 8065
    targetPort: 8065
---
apiVersion: v1
kind: Service
metadata:
  namespace: mattermost-ns
  name: mattermost-db-service
spec:
  type: ClusterIP
  selector:
    app: mattermost-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
