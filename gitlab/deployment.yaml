apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gitlab-ns
  name: gitlab-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ee:latest
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: ssh
          containerPort: 22
        envFrom:
        - configMapRef:
            name: gitlab-config
        volumeMounts:
        - name: gitlab-config
          mountPath: /etc/gitlab
        - name: gitlab-logs
          mountPath: /var/log/gitlab
        - name: gitlab-data
          mountPath: /var/opt/gitlab
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: gitlab-config
        persistentVolumeClaim:
          claimName: gitlab-config-storage-claim
      - name: gitlab-logs
        persistentVolumeClaim:
          claimName: gitlab-logs-storage-claim
      - name: gitlab-data
        persistentVolumeClaim:
          claimName: gitlab-data-storage-claim
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
