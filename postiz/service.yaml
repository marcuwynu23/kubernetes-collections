apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-service
spec:
  type: ClusterIP
  selector:
    app: postiz
  ports:
  - name: http
    protocol: TCP
    port: 4007
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-db-service
spec:
  type: ClusterIP
  selector:
    app: postiz-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-redis-service
spec:
  type: ClusterIP
  selector:
    app: postiz-redis
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-temporal-service
spec:
  type: ClusterIP
  selector:
    app: postiz-temporal
  ports:
  - name: rpc
    protocol: TCP
    port: 7233
    targetPort: 7233
---
apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-temporal-db-service
spec:
  type: ClusterIP
  selector:
    app: postiz-temporal-db
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  namespace: postiz-ns
  name: postiz-temporal-es-service
spec:
  type: ClusterIP
  selector:
    app: postiz-temporal-es
  ports:
  - name: http
    protocol: TCP
    port: 9200
    targetPort: 9200
