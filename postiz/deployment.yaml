            secretKeyRef:
              name: postiz-temporal-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postiz-temporal-secrets
              key: postgres-password
        volumeMounts:
        - name: postiz-temporal-db-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - sh
