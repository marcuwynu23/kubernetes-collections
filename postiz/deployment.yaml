apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: postiz-ns
  name: postiz-temporal-es-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postiz-temporal-es
  template:
    metadata:
      labels:
        app: postiz-temporal-es
    spec:
      containers:
      - name: elasticsearch
        image: elasticsearch:7.17.27
        ports:
        - name: http
          containerPort: 9200
        env:
        - name: cluster.routing.allocation.disk.threshold_enabled
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: cluster.routing.allocation.disk.threshold_enabled
        - name: cluster.routing.allocation.disk.watermark.low
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: cluster.routing.allocation.disk.watermark.low
        - name: cluster.routing.allocation.disk.watermark.high
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: cluster.routing.allocation.disk.watermark.high
        - name: cluster.routing.allocation.disk.watermark.flood_stage
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: cluster.routing.allocation.disk.watermark.flood_stage
        - name: discovery.type
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: discovery.type
        - name: ES_JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: ES_JAVA_OPTS
        - name: xpack.security.enabled
          valueFrom:
            configMapKeyRef:
              name: postiz-temporal-config
              key: xpack.security.enabled
        volumeMounts:
        - name: postiz-temporal-es-storage
          mountPath: /usr/share/elasticsearch/data
        readinessProbe:
          httpGet:
            path: /
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postiz-temporal-es-storage
        persistentVolumeClaim:
          claimName: postiz-temporal-es-storage-claim
