name: Validate Kubernetes Manifests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Kubeconform
      uses: yokawasa/action-setup-kubeconform@v1
      with:
        version: "0.6.7"

    - name: Install KubeLinter
      uses: stackrox/kube-linter-action@v1
      with:
        directory: .

    - name: Validate Kubernetes schemas
      shell: bash
      run: |
        set -e

        find . -mindepth 1 -maxdepth 1 -type d \
          ! -name ".github" \
          -print0 |
        while IFS= read -r -d '' dir; do
          if find "$dir" -type f \( -name "*.yaml" -o -name "*.yml" \) -print -quit | grep -q .; then
            echo "Validating: $dir"
            kubeconform \
              -strict \
              -summary \
              -recursive \
              "$dir"
          fi
        done
