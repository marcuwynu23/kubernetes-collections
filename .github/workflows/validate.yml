name: Validate Kubernetes Manifests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate Kubernetes manifests
      shell: bash
      run: |
        find . -mindepth 1 -maxdepth 1 -type d \
          ! -name ".github" \
          -exec sh -c '
            find "$1" -type f \( -name "*.yaml" -o -name "*.yml" \) -print -quit |
            grep -q .
          ' _ {} \; \
          -print0 |
          xargs -0 kubectl apply --dry-run=client -R -f
